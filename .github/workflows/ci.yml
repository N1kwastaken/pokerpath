name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22' # mesma do Render (render.yaml)
          cache: npm

      # --include=dev: o CI exporta NODE_ENV=production em alguns contextos e
      # sem as devDependencies não há tsc, vite nem vitest.
      - run: npm ci --include=dev

      # O client Prisma precisa existir antes do tsc (o postinstall do npm
      # workspaces não acha o schema sozinho) — mesma ordem do build do Render.
      - run: npm run db:generate

      # build:shared antes do typecheck: o web resolve @pokerpath/shared por
      # ./dist, que só existe depois deste passo.
      - run: npm run build:shared

      - run: npm run typecheck
      - run: npm test

      # Reproduz a parte crítica do build do Render: gera o schema/client
      # Postgres e compila API + web. Assim um CI verde prova que o artefato de
      # produção existe antes de o Render iniciar o deploy.
      - run: npm run deploy:generate -w @pokerpath/api
      - run: npm run build
